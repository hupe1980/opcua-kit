[package]
name = "opcua-kit"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Embeddable OPC UA client, server and UADP library for Rust applications"
license = "MIT OR Apache-2.0"
homepage = "https://hupe1980.github.io/opcua-kit/"
repository = "https://github.com/hupe1980/opcua-kit"
readme = "README.md"
keywords = ["opcua", "opc-ua", "automation"]
categories = ["command-line-utilities", "network-programming"]
include = [
    "/src/**/*.rs",
    "/tools/generate-ua.py",
    "/examples/*.rs",
    "/fixtures/commissioning/*.json",
    "/fixtures/units/*.json",
    "/fixtures/meter/*.json",
    "/fixtures/meter/*.ndjson",
    "/tests/**/*.rs",
    "/tests/**/*.py",
    "/tests/**/*.cjs",
    "/tests/**/*.sh",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/site/README.md",
    "/site/content/authoring.md",
    "/site/content/client.md",
    "/site/content/services.md",
    "/site/content/navigation.md",
    "/site/content/recovery.md",
    "/site/content/meter.md",
    "/site/content/automation.md",
    "/site/content/capture.md",
    "/LICENSE-*",
]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[features]
default = ["discovery", "pubsub"]
discovery = []
server = [
    "dep:aes",
    "dep:base64",
    "dep:cbc",
    "dep:getrandom",
    "dep:hmac",
    "dep:rsa",
    "dep:sha1",
    "dep:sha2",
    "dep:thiserror",
    "dep:time",
    "dep:uuid",
    "dep:x509-parser",
    "dep:zeroize",
]
pubsub = []
control = ["client"]
commissioning = ["dep:serde", "dep:serde_json", "dep:uuid", "dep:base64"]
cems = ["commissioning", "dep:time"]
client = [
    "dep:aes",
    "dep:base64",
    "dep:cbc",
    "dep:getrandom",
    "dep:hmac",
    "dep:rsa",
    "dep:sha1",
    "dep:sha2",
    "dep:thiserror",
    "dep:time",
    "dep:tokio",
    "dep:uuid",
    "dep:x509-parser",
    "dep:zeroize",
    "discovery",
    "tokio/time",
]
cli = [
    "client",
    "commissioning",
    "dep:clap",
    "dep:pem-rfc7468",
    "dep:rustix",
    "dep:tempfile",
]

[[bin]]
name = "opcua-kit"
path = "src/bin/opcua-kit/main.rs"
required-features = ["cli"]

[[example]]
name = "discover"
required-features = ["discovery"]

[[example]]
name = "read"
required-features = ["client"]

[[example]]
name = "local_server"
required-features = ["server"]

[[example]]
name = "uadp"
required-features = ["pubsub"]

[[example]]
name = "project_meter"
required-features = ["cems"]

[dependencies]
rsa = { version = "0.10", features = ["sha1", "pkcs1v15"], optional = true }
sha1 = { version = "0.11", optional = true }
sha2 = { version = "0.10", optional = true }
aes = { version = "0.8", optional = true }
cbc = { version = "0.1", optional = true }
hmac = { version = "0.12", optional = true }
getrandom = { version = "0.4", optional = true }
zeroize = { version = "1", optional = true }
tokio = { version = "1", features = ["rt", "sync"], optional = true }
thiserror = { version = "2", optional = true }
x509-parser = { version = "0.18.1", default-features = false, optional = true }

serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
time = { version = "0.3.55", default-features = false, features = ["parsing", "formatting"], optional = true }
uuid = { version = "1", default-features = false, optional = true }
base64 = { version = "0.22", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
pem-rfc7468 = { version = "1", features = ["alloc"], optional = true }
tempfile = { version = "3", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1", features = ["fs"], optional = true }
