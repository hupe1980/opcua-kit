name: Site
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    concurrency:
      group: site-build-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Zola 0.23.6
        run: |
          archive="$RUNNER_TEMP/zola.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/getzola/zola/releases/download/v0.23.6/zola-v0.23.6-x86_64-unknown-linux-musl.tar.gz
          echo "7d77a4220a4f699cba2fc0e0c7859f780e887e269159ad4fab90e11ea16c906f  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" zola
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check links and build the site
        working-directory: site
        run: |
          zola check --skip-external-links
          zola build
          python3 check_output.py
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site/public
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - id: release
        uses: actions/deploy-pages@v4
